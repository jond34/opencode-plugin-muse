name: test

# Manual only, like `publish.yml`: this matrix answers "does the offline suite
# pass off Linux" (U16), and nobody has run it yet. Until it is dispatched, the
# honest claim stays "tested on Linux, unmeasured elsewhere".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: offline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned by commit SHA for the same reason as the publish job: a
      # retargeted action tag runs whatever it likes with this repo's token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # No `scripts/repro.sh`: it is a bash reproduction script, not a test, and
      # it is not meaningful on PowerShell.
      - run: npm ci
      - run: npm run check:offline
