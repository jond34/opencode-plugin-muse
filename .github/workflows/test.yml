name: test

# Manual only, like `publish.yml`: this matrix answers "does the offline suite
# pass off Linux" (U16), and nobody has run it yet. Until it is dispatched, the
# honest claim stays "tested on Linux, unmeasured elsewhere".
on:
  workflow_dispatch:
    inputs:
      real_windows:
        description: "E16a/E16c: install real Muse on Windows and measure the serve close path"
        type: boolean
        default: false
      macos_only:
        description: "E17: run the offline job on macos-15 only, to retry the cancelled macOS cell"
        type: boolean
        default: false
  # Branch-only: `workflow_dispatch` needs the file on the default branch, and
  # this file is not there yet, so a run is selected by branch name instead.
  # `ci/seam` is the full matrix, `ci/real` is E16a/E16c alone, `ci/mac` is the
  # macOS label retry. Drop this trigger when the round lands.
  push:
    branches: [ci/seam, ci/real, ci/mac]

permissions:
  contents: read

jobs:
  # The suite is a support claim on every OS it runs on (D147). It was called
  # informational while the POSIX fixtures were unclassified; E22 read the
  # assertions and separated them from the one product bug (`C:\` entries read as
  # package names). A red cell here is now a finding, not a known condition.
  offline:
    name: offline (${{ matrix.os }})
    # `ci/real` is the installer job and nothing else: the matrix would only
    # add the same crowd of minutes to the same run.
    if: ${{ !contains(github.ref, 'ci/real') }}
    strategy:
      fail-fast: false
      matrix:
        # E17 needs one macOS label, and `macos-latest` is now macOS 26 (arm64):
        # the cancelled round-22 cell was an arm64 acquisition failure, so the
        # retry names `macos-15` explicitly.
        os: ${{ (contains(github.ref, 'ci/mac') || (github.event_name == 'workflow_dispatch' && inputs.macos_only)) && fromJSON('["macos-15"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned by commit SHA for the same reason as the publish job: a
      # retargeted action tag runs whatever it likes with this repo's token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # No `scripts/repro.sh`: it is a bash reproduction script, not a test, and
      # it is not meaningful on PowerShell.
      - run: npm ci
      # B4: the artifact did not say which architecture produced it, and
      # macos-latest is arm64 while the other two are x64. Record it on the run
      # and hand it to the summary script, so a later snapshot needs no inference.
      - name: Record runner
        shell: bash
        run: |
          echo "runner=${{ runner.os }}-${{ runner.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "RUNNER_ARCH=${{ runner.os }}-${{ runner.arch }}" >> "$GITHUB_ENV"
      # `npm run` appends these to the script string, so `tsc` runs first and
      # bun gets the reporter. The artifact is what makes a count question
      # answerable later without another dispatch (E24): per-file tests= counts
      # plus the hostname and commit properties.
      - run: npm run check:offline -- --reporter=junit --reporter-outfile=junit.xml --reporter-junit-suites=flat
      - name: Summarize JUnit
        if: always()
        shell: bash
        run: |
          if [ -f junit.xml ]; then
            mkdir -p junit-frame
            cp junit.xml junit-frame/junit.xml
            bun scripts/junit-summary.ts junit-frame > junit-summary.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: junit-${{ matrix.os }}
          path: |
            junit.xml
            junit-summary.json
          if-no-files-found: ignore

  # E11/E12: the Windows spawn contract, without Muse. A stub `muse.cmd`, a
  # native binary renamed `muse-bin-9.9.9-R1.1.exe`, and a `.muse-version`
  # pointer reproduce the installer's layout; `hostname.exe` stands in for the
  # real binary so a successful spawn is observable. This proves the resolver
  # and the EINVAL/ENOENT contract on a real Windows kernel — it is not a
  # support claim: no `muse serve` runs.
  seam-windows:
    name: seam-windows (spawn contract, stub binary)
    if: ${{ !contains(github.ref, 'ci/real') && !contains(github.ref, 'ci/mac') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: E11 spawn contract
        shell: pwsh
        run: node test/seam/windows-spawn.mjs
      # Timeboxed and never gating: a hosted runner may reap the tree with a job
      # object, which makes a clean result inconclusive rather than good news.
      - name: E12 kill semantics (informational)
        shell: pwsh
        continue-on-error: true
        run: node test/seam/windows-kill.mjs
      # E38: a detached grandchild; the sampler's blind spot is the measurement.
      - name: E38 grandchild survivor (informational)
        shell: pwsh
        continue-on-error: true
        run: node test/seam/windows-grandchild.mjs
      # E42: diagnose the EOF arm's unsettled close without changing its budget.
      - name: E42 close after EOF (informational)
        shell: pwsh
        continue-on-error: true
        run: node test/seam/windows-close.mjs

  # E16a/E16c: the vendor installer, the binary it writes, and a real `muse
  # serve` closed through the plugin's own path. No credential: the handshake is
  # local to the host, and a model turn would need the user's browser login —
  # `src/host-config.ts` deletes `META_API_KEY`, so a key is not the supported
  # route and its absence is not a gap in this measurement.
  real-windows:
    name: real-windows (installer + serve lifecycle)
    if: ${{ contains(github.ref, 'ci/real') || (github.event_name == 'workflow_dispatch' && inputs.real_windows) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      # The installer retries with a token only after an anonymous download is
      # refused, so an unauthenticated runner is expected to work. Whether it
      # does is itself a result: capture the log rather than let `iex` swallow it.
      - name: E16a install (vendor script)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          try { irm https://dev.meta.ai/install.ps1 | iex } catch { "install threw: $_" }
          "install exit: $LASTEXITCODE"
      - name: Install layout
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\muse'
          if (Test-Path $dir) {
            Get-ChildItem $dir -Force | Select-Object Name, Length | Format-Table -AutoSize | Out-String
            Get-Content (Join-Path $dir '.muse-version') -ErrorAction SilentlyContinue
          } else { "no install dir at $dir" }
      - name: E16a/E16c
        shell: pwsh
        run: node test/seam/windows-real.mjs
