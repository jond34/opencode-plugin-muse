name: publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA: this job holds an OIDC publish token, so a
      # retargeted action tag could publish a tarball of its own choosing.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # Staged publishing requires npm 11.15+. Pin it so the runner does not
      # depend on the npm bundled with the Node image.
      - run: npm install -g npm@11.19.1
      - run: npm ci
      - run: bash scripts/repro.sh
      - run: npm run check:offline
      - run: npm stage publish
