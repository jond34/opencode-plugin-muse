name: publish

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA: this job holds an OIDC publish token, so a
      # retargeted action tag could publish a tarball of its own choosing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # Staged publishing requires npm 11.15+. Pin it so the runner does not
      # depend on the npm bundled with the Node image.
      - run: npm install -g npm@11.19.1
      - run: npm ci
      - run: bash scripts/repro.sh
      - run: npm run check:offline
      - name: Release gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-release.sh
      - run: npm stage publish
